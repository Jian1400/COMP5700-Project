name: Run Project Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install numpy pandas PyYAML pypdf transformers accelerate pytest

      - name: Verify dependencies
        run: |
          python -c "import torch, numpy, pandas, yaml, pypdf, transformers, pytest; print('All dependencies imported successfully.')"

      - name: Run tests
        run: |
          python -m pytest tests/ -v
