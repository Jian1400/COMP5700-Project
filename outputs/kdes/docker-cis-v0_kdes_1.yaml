element765:
  name: Profile Definitions
  requirements:
  - 'The following configuration profiles are defined by this Benchmark: • Level 1
    - Docker - Linux'
  - 'Items in this profile intend to: o Be practical and prudent; o Provide a clear
    security benefit; and o Not inhibit the utility of the technology beyond acceptable
    means.'
element766:
  name: Linux Hosts Specific Configuration
  requirements:
  - Secure the Docker host
  - Follow your infrastructure security best practices
element767:
  name: Partition Management
  requirements:
  - Ensure a separate partition for containers has been created
element768:
  name: Docker Storage Directory
  requirements:
  - Create a separate partition (logical volume) for storing Docker files.
element769:
  name: Data Sensitivity Classification
  requirements:
  - Do not process sensitive data on enterprise assets intended for lower sensitivity
    data.
element770:
  name: Establish an Access Granting Process
  requirements:
  - Establish and follow a process, preferably automated, for granting access to enterprise
    assets upon new hire, rights grant, or role change of a user.
element771:
  name: Audit Docker Daemon Activities
  requirements:
  - Verify that there are audit rules for the Docker daemon.
  - 'Add the line below to the /etc/audit/rules.d/audit.rules file: -w /usr/bin/dockerd
    -k docker'
element772:
  name: Ensure logging, per the enterprise’s audit log management process, has been
