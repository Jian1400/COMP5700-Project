element34:
  name: Ensure auditing is configured for Docker files and directories
  requirements:
  - Containerd.sock (Automated)
  - 'Profile Applicability: Level 2 - Docker - Linux'
  - 'Description: Audit containerd.sock, if applicable.'
  - 'Rationale: As well as auditing the normal Linux file system and system calls,
    you should also audit the Docker daemon.'
  - 'Impact: Auditing can generate large log files. You should ensure that these are
    rotated and archived periodically.'
  - 'Audit: Step 1: Find out the file location: \grep ''containerd.sock'' /etc/containerd/config.toml
    or by checking the Docker --containerd option.'
  - 'Step 2: If the file does not exist, this recommendation is not applicable. If
    the file exists, you should verify that there is an audit rule corresponding to
    the file: For example, you could execute the command below: auditctl -l | grep
    containerd.sock This should display a rule for containerd.sock.'
  - 'Remediation: If the file exists, you should add a rule for it. For example: Add
    the line below to the /etc/audit/audit.rules file: -w /run/containerd/containerd.sock
    -k docker'
  - Restart the audit daemon.
  - 'Description: Audit docker.socket, if applicable.'
  - 'Rationale: As well as auditing the normal Linux file system and system calls,
    you should also audit the Docker daemon. Because this daemon runs with root privileges,
    it is very important to audit its activities and usage. Its behavior depends on
    some key files and directories with docker.socket being one such file, and as
    this holds various parameters for the Docker daemon, it should be audited.'
  - 'Impact: Auditing can generate large log files. You should ensure that these are
    rotated and archived periodically. A separate partition should also be created
    for audit logs to avoid filling up any other critical partition.'
