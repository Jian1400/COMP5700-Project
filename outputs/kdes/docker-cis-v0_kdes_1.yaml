element32:
  name: Audit Docker files and directories
  requirements:
  - Audit the docker.service if applicable.
  - Automated
  - 'Profile Applicability: Level 2 - Docker - Linux'
  - Verify an audit rule is applied to /run/containerd.
  - Execute auditctl -l | grep /run/containerd to list an audit rule.
  - Verify an audit rule is applied to /etc/docker
