element815:
  name: Restrict /etc/default/docker file permissions to 644 or more restrictively
  requirements:
  - The /etc/default/docker file contains sensitive parameters that may alter the
    behavior of the Docker daemon.
  - It should therefore be writeable only by root in order to ensure that it is not
    modified by less privileged users.
element816:
  name: Set file permissions to 644
  requirements:
