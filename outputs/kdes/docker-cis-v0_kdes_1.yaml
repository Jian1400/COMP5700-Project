  requirements:
  - Keep a tab on these product updates
element786:
  name: Docker version verification
  requirements:
  - docker version
element787:
  name: Use Up-to-Date and Trusted Third-Party Software Components
  requirements:
  - Choose established and proven frameworks and libraries that provide adequate security.
  - Acquire these components from trusted sources or evaluate the software for vulnerabilities
    before use.
element788:
  name: Run the Docker daemon as a non-root user
  requirements:
  - Manual
element789:
  name: Network Bridge Configuration
  requirements:
  - Ensure network traffic is restricted between containers on the default bridge.
element790:
  name: Network Capability Restriction
  requirements:
  - Drop NET_RAW capability for all containers connected to the Docker0 bridge.
element791:
  name: Ensure iptables is enabled before Docker starts
  requirements:
  - Any restarts of iptables during Docker daemon operation may result in losing Docker
    created rules.
element792:
  name: Ensure --iptables=false parameter is not present or not set to false
  requirements:
  - Do not run the Docker daemon with --iptables=false parameter.
element793:
  name: Review /etc/docker/daemon.json for --iptables=false setting
  requirements:
  - Review the dockerd startup options and settings in /etc/docker/daemon.json.
element794:
  name: Verify iptables is set to true by default
  requirements:
  - By default, iptables is set to true.
element795:
  name: Allowlist Authorized Software
  requirements:
  - Use technical controls, such as application allowlisting, to ensure that only
    authorized software can execute or be accessed.
element796:
  name: Storage Driver Selection
  requirements:
  - Use overlay2 as the default storage driver on most of the platforms.
  - Use the storage driver that is recommended by your preferred vendor and which
    is in line with policy around the applications which are being deployed.
element797:
  name: cgroup parent setting
  requirements:
  - Ensure --cgroup-parent parameter is either not set or is set as appropriate non-default
    cgroup.
element798:
  name: Configure authorization policy
  requirements:
  - Configure the authorization policy as desired.
element799:
  name: Start Docker daemon with --authorization-plugin
  requirements:
  - 'Start the docker daemon as below: dockerd --authorization-plugin=<PLUGIN_ID>'
element800:
  name: Live Restore Enabled
  requirements:
  - Ensure live restore is enabled (Manual)
element801:
  name: Disable Userland Proxy on Startup
  requirements:
  - The Docker daemon starts a userland proxy service for port forwarding whenever
    a port is exposed.
  - Where hairpin NAT is available, the userland proxy should be disabled on startup
    to reduce the attack surface of the installation.
element802:
  name: Set `--userland-proxy=false`
  requirements:
  - Dockerd --userland-proxy=false
element803:
  name: Seccomp Profile Application
  requirements:
  - Application security is improved by reviewing system calls in line with organizational
    security policy.
  - A reduced set of system calls reduces the total kernel surface exposed to the
    application.
element804:
  name: Docker Default Seccomp Profile
  requirements:
  - Docker's default seccomp profile is applied by default.
  - Docker's default seccomp profile is scrutinized and addresses critical vulnerabilities/issues
    within container environments.
element805:
