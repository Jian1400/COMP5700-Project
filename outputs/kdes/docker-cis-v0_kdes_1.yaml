element647:
  name: Ensure the container's root filesystem is mounted as read only (Manual)
  requirements:
  - 'Profile Applicability: • Level 1 - Docker - Linux'
  - 'Description: The container''s root filesystem should be treated as a ''golden
    image'' by using Docker run''s --read-only option. This prevents any writes to
    the container''s root filesystem at container runtime and enforces the principle
    of immutable infrastructure.'
  - 'Rationale: Enabling this option forces containers at runtime to explicitly define
    their data writing strategy to persist or not persist their data. This also reduces
    security attack vectors since the container instance''s filesystem cannot be tampered
    with or written to unless it has explicit read-write permissions on its filesystem
    folder and directories.'
  - 'Example: • Enable use --tmpfs for temporary file writes to /tmp • Use Docker
    shared data volumes for persistent data writes'
