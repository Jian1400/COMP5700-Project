  requirements:
  - Ensure that the docker.service file ownership is set to root:root (Automated)
element806:
  name: verify file ownership
  requirements:
  - 'Step 1: Find out the file location: systemctl show -p FragmentPath docker.service'
  - 'Step 2: If the file does not exist, this recommendation is not applicable.'
  - 'Step 3: If the file exists, execute the command below including the correct file
    path in order to verify that the file is owned and group owned by root.'
  - 'Step 4: For example: stat -c %U:%G /usr/lib/systemd/system/docker.service | grep
    -v root:root'
