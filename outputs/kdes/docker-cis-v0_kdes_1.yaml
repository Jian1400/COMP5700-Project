element103:
  name: Rationale
  requirements:
  - Experimental
  - Unnecessary software should not be installed into containers, as doing so increases
    their attack surface. Only packages strictly necessary for the correct operation
    of the application being deployed should be installed.
  - setuid and setgid permissions can be used for privilege escalation.
  - Consider removing them from packages which do not need them.
  - A large number of system calls are exposed to every userland process with many
    of them going unused for the entire lifetime of the process.
  - Most applications do not need all these system calls and would therefore benefit
    from having a reduced set of available system calls.
  - Docker connects virtual interfaces created in bridge mode to a common bridge called
    docker0.
  - This default networking model is vulnerable to ARP spoofing and MAC flooding attacks
    as there is no filtering applied to it.
  - ulimit provides control over the resources available to the shell and to processes
    started by it.
  - Setting system resource limits in a prudent fashion, protects against denial of
    service conditions.
element104:
  name: Audit
  requirements:
  - Run the command below and ensure that the Experimental property is set to false
    in the Server section.
  - docker version --format '{{ .Server.Experimental }}'
  - 'List all the running instances of containers by executing the command below:
    docker ps --quiet'
  - Run the command below against each image to list the executables which have either
    setuid or setgid permissions.
  - 'Run the following command: docker ps --quiet --all | xargs docker inspect --format
    ''{{ .Id }}: SecurityOpt={{ .HostConfig.SecurityOpt }}'''
  - This should return either <no value> or your modified seccomp profile.
  - 'Step 1: Open your image repository and list the image version history for the
    image you are inspecting.'
  - 'Step 2: Observe the status when the docker pull command is triggered.'
  - 'Step 3: Match the version of the image you are running to the latest version
    reported in your repository and this will tell you whether you are running the
    cached version or the latest copy.'
  - Run the command below, and verify that containers are on a user-defined network
    and not the default docker0 bridge.
  - "docker network ls --quiet | xargs docker network inspect --format '{{ .Name \n\
    \        }}: {{ .Options }}'"
  - All the containers should be run in this network.
  - "Run the command below: docker ps --quiet --all | xargs docker inspect --format\
    \ '{{ .Id }}: \nUlimits={{ .HostConfig.Ulimits }}' This command should return\
    \ Ulimits=<no value> for each container instance unless there is a need in a specific\
    \ case to override the default settings."
element105:
  name: Remediation
  requirements:
  - You should not pass --experimental as a runtime parameter to the Docker daemon
    on production systems.
  - chmod 644 /etc/default/docker
  - You should not install anything within the container that is not required.
  - Consider using a minimal base image rather than the standard Centos, Debian, or
    Red Hat images if you can.
  - Allow setuid and setgid permissions only on executables which require them.
  - 'You could remove these permissions at build time by adding the following command
    in your Dockerfile: RUN find / -perm /6000 -type f -exec chmod a-s {} \; || true'
  - You should run the container with only as much memory as it requires by using
    the --memory argument.
  - By default, seccomp profiles are enabled.
  - You do not need to do anything unless you want to modify and use a modified seccomp
    profile.
  - You should use proper version pinning mechanisms (the "latest" tag which is assigned
    by default is still vulnerable to caching attacks) to avoid extracting cached
    older versions.
  - Version pinning mechanisms should be used for base images, packages, and entire
    images.
  - You should only override the default ulimit settings if needed in a specific case.
