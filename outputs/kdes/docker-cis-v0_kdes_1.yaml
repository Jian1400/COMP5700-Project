element1:
  name: Terms of Use
  requirements:
  - Access to the CIS Docker Benchmark v1.6.0 - 06-14-2023
  - Compliance with the terms of use
element2:
  name: Baseline Configuration
  requirements:
  - Establish a baseline configuration for the Docker Engine v20.10 instance.
  - Ensure the Docker Engine is running with the default configuration.
element3:
  name: Security Hardening
  requirements:
  - Implement security hardening measures, such as disabling unnecessary services.
  - Configure firewall rules to restrict network access.
element4:
  name: Container Isolation
  requirements:
  - Utilize container isolation mechanisms to limit the impact of container breaches.
  - Implement network policies to restrict communication between containers.
element5:
  name: Image Scanning
  requirements:
  - Implement image scanning to identify vulnerabilities in container images.
  - Regularly scan container images for vulnerabilities.
element6:
  name: Logging and Monitoring
  requirements:
  - Enable comprehensive logging and monitoring of Docker Engine activity.
  - Configure alerts for suspicious events.
element7:
  name: Consensus Review Process
  requirements:
  - The process combines real world experience with data-based information.
  - The process involves a global community of subject matter experts.
element8:
  name: Initial Benchmark Development
  requirements:
  - Subject matter experts convene to discuss, create, and test working drafts of
    the Benchmark.
element9:
  name: Feedback Review
  requirements:
  - All feedback provided by the Internet community is reviewed by the consensus team.
element10:
  name: Automated
  requirements:
  - Assessment of technical controls can be fully automated
  - Necessary information for automation is included
  - Assessment of technical control can be fully automated
element11:
  name: Manual
  requirements:
  - Assessment of technical controls cannot be fully automated
  - All or some manual steps are required to validate the configured state
  - Assessment of technical control requires manual steps to validate configuration
    state
element12:
  name: Profile
  requirements:
  - A collection of recommendations for securing a technology or a supporting platform
  - Level 2 extends Level 1 recommendations
element13:
  name: Description
  requirements:
  - Detailed information pertaining to the setting with which the recommendation is
    concerned
element14:
  name: Rationale Statement
  requirements:
  - Detailed reasoning for the recommendation to provide the user a clear and concise
    understanding on the importance of the recommendation
element15:
  name: Impact Statement
  requirements:
  - Any security, functionality, or operational consequences that can result from
    following the recommendation
element16:
  name: Audit Procedure
  requirements:
  - Systematic instructions for determining if the target system complies with the
    recommendation
element17:
  name: Remediation Procedure
  requirements:
  - Systematic instructions for applying recommendations to the target system to bring
    it into compliance according to the recommendation
element18:
  name: Default Value
  requirements:
  - Default value for the given setting in this recommendation, if known. If not known,
    either not configured or not defined will be applied
  - Containers are run with root privileges and also run as the root user inside the
    container
  - Not Applicable.
  - Mapping a container port to a privileged port on the host is allowed.
  - When you run a container, it uses the default profile unless you override it with
    the --security-opt option.
  - By default, Docker commands extract the local copy unless version pinning mechanisms
    are used or the local cache is cleared.
  - By default, Docker runs containers within the default docker0 bridge.
  - Mapping a container port to a privileged port on the host is allowed by default.
element19:
  name: Security Benefit
  requirements:
  - Provide a clear security benefit
element20:
  name: Security Control
  requirements:
  - Not inhibit the utility of the technology beyond acceptable means
element21:
  name: Level 1 - Docker Swarm
  requirements:
  - For use if Docker Swarm will be enabled
element22:
  name: Host Configuration
  requirements:
  - Secure the Docker host
  - Follow your infrastructure security best practices
  - Ensure a separate partition for containers has been created (Manual)
  - Ensure only trusted users are allowed to control Docker daemon (Manual)
  - Ensure auditing is configured for the Docker daemon (Automated)
  - Ensure auditing is configured for Docker files and directories - /run/containerd
    (Automated)
  - Ensure auditing is configured for Docker files and directories - /var/lib/docker
    (Manual)
  - Ensure auditing is configured for Docker files and directories - /etc/docker (Automated)
  - Ensure auditing is configured for Docker files and directories - docker.service
    (Automated)
  - Ensure auditing is configured for Docker files and directories - containerd.sock
    (Automated)
  - Ensure auditing is configured for Docker files and directories - docker.socket
    (Automated)
  - Ensure auditing is configured for Docker files and directories - /etc/default/docker
    (Automated)
  - Ensure auditing is configured for Docker files and directories - /etc/docker/daemon.json
    (Automated)
element23:
  name: Partition
  requirements:
  - Create a separate partition (logical volume) for storing Docker files.
element24:
  name: Docker Root Directory
  requirements:
  - The configured root directory should be a mount point.
element25:
  name: CIS Control
  requirements:
  - Version Control IG 1
  - Establish and follow a process, preferably automated, for granting access to enterprise
    assets upon new hire, rights grant, or role change of a user.
  - Use standard, industry-recommended hardening configuration templates for application
    infrastructure.
  - Apply standard, industry-recommended hardening configuration templates for underlying
    servers, databases, and web servers.
  - Secure Configuration for Hardware and Software on Mobile Devices, Laptops, Workstations
    and Servers
  - Ensure that the version of Docker is up to date (Manual)
element26:
  name: Auditing
  requirements:
  - Verify that there are audit rules for the Docker daemon.
  - 'Add the line below to the /etc/audit/rules.d/audit.rules file: -w /usr/bin/dockerd
    -k docker'
  - 'Profile Applicability: • Level 2 - Docker - Linux'
  - Audit /etc/default/docker, if applicable.
  - You should verify that there is an audit rule associated with the /etc/default/docker
    file.
  - 'Add the line below to the /etc/audit/audit.rules file: -w /etc/default/docker
    -k docker'
element27:
  name: Audit Logging
  requirements:
  - Collect audit logs.
  - Ensure that logging, per the enterprise’s audit log management process, has been
    enabled across enterprise assets.
  - Ensure that local logging has been enabled on all systems and networking devices.
  - Enable detailed logging to include event source, date, user, timestamp, source
    addresses, destination addresses, and other useful elements.
  - Configure detailed audit logging for enterprise assets containing sensitive data
  - Include event source, date, username, timestamp, source addresses, destination
    addresses, and other useful elements that could assist in a forensic investigation.
  - Configure detailed audit logging for enterprise assets containing sensitive data.
  - Enforce detailed audit logging for access to sensitive data or changes to sensitive
    data
  - Add a rule for /usr/bin/runc file
  - Enforce detail logging for access or changes to sensitive data
  - Configure detailed audit logging for enterprise assets
  - Add a rule for the /var/lib/docker directory
