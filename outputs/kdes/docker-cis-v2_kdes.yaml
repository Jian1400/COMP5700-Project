element62:
  name: Remediation
  requirements:
  - You should remove any untrusted users from the docker group.
  - Allow setuid and setgid permissions only on executables which require them.
  - You should not mount directories which are security sensitive on the host within
    containers, especially in read-write mode.
  - Additionally, you should not create a mapping of sensitive directories from the
    host to container volumes.
