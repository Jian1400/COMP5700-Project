  requirements:
  - Audit /var/lib/docker
element61:
  name: Audit /var/lib/docker/volumes
  requirements:
  - "Add the line as below to the /etc/audit/rules.d/audit.rules file: -a exit,always\
    \ -F path=/var/lib/docker -F perm=war -k docker -a exit,never -F dir=/var/lib/docker/volumes\
    \ \n\t\t\t\t-a exit,never -F dir=/var/lib/docker/165536.165536/volumes \n\t\t\t\
    \t-a exit,never -F dir=/var/lib/docker/165536.165536/overlay2"
