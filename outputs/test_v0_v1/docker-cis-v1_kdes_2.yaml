element51:
  name: Segment Data Processing and Storage Based on Sensitivity
  requirements:
  - Do not process sensitive data on enterprise assets intended for lower sensitivity
    data.
element52:
  name: Controlled Access Based on the Need to Know
  requirements:
  - The Docker daemon currently requires access to the Docker socket which is, by
    default, owned by the user root and the group docker.
element53:
  name: Remediation
  requirements:
  - You should remove any untrusted users from the docker group.
  - Allow setuid and setgid permissions only on executables which require them.
element54:
  name: Default Value
  requirements:
  - Not Applicable
element55:
  name: Audit Docker Daemon Activities
  requirements:
