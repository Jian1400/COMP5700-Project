element832:
  name: Docker daemon currently requires access to the Docker socket which is, by
    default, owned by the user root and the group docker.
  requirements:
  - Docker allows you to share a directory between the Docker host and a guest container
    without limiting the access rights of the container. This means that you can start
    a container and map the / directory on your host to the container. The container
    would then be able to modify your host file system without any restrictions. This
    means that you could gain elevated privileges simply by being a member of the
    docker group and subsequently start a container which maps the root / directory
    on the host.
element833:
  name: You should remove any untrusted users from the docker group.
  requirements:
  - Remove any untrusted users from the docker group.
element834:
