  name: Establish and Maintain a Secure Configuration Process
  requirements:
  - Establish and maintain a secure configuration process for enterprise assets
  - Review and update documentation annually, or when significant enterprise changes
    occur that could impact this Safeguard.
element89:
  name: Controlled Use of Administrative Privileges
  requirements:
  - Controlled Use of Administrative Privileges
  - By default, all network traffic is allowed between containers on the same host
    on the default network bridge.
element90:
  name: log-level
  requirements:
  - Set Docker daemon log level to info
element91:
  name: docker0 bridge
  requirements:
  - Drop NET_RAW capability
element92:
  name: Allow Docker to make changes to iptables
  requirements:
  - Docker should be allowed to make changes to the iptables ruleset.
  - Docker server will automatically make any required changes.
  - Docker daemon service requires iptables rules to be enabled before it starts.
  - Docker will automatically make any required changes.
element93:
  name: Enable iptables rules on all systems and networking devices
  requirements:
  - Local logging has been enabled on all systems and networking devices.
element94:
  name: Docker daemon service requires iptables rules to be enabled before it starts
  requirements:
  - Any restarts of iptables during Docker daemon operation may result in losing Docker
    created rules.
element95:
  name: Establish and Maintain a Secure Network Architecture
  requirements:
  - Establish and maintain a secure network architecture.
  - Address segmentation, least privilege, and availability.
  - 2.5 Ensure insecure registries are not used (Manual)
  - Ensure insecure registries are not used (Manual)
element96:
