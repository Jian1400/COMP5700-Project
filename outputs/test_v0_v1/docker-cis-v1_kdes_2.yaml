    grant, or role change of a user.
  - Audit all Docker daemon activities.
element56:
  name: Audit Docker Daemon Rules
  requirements:
  - Verify that there are audit rules for the Docker daemon.
  - 'Add the line below to the /etc/audit/rules.d/audit.rules file: -w /usr/bin/dockerd
    -k docker'
