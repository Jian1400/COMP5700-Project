element38:
  name: CIS Benchmarks
  requirements:
  - A key component of a comprehensive cybersecurity program
element39:
  name: Recommendation Definition
  requirements:
  - Recommendation definition should be concise.
  - Recommendation definition should include the intended configuration.
element40:
  name: Assessment Status
  requirements:
  - Assessment status should be automated.
  - Assessment status should be equally important.
  - Define the assessment status for every recommendation.
element41:
  name: Profile
  requirements:
  - Profile should include Level 1 and Level 2.
element42:
  name: Description
  requirements:
  - Description should provide a clear and concise understanding.
  - Provide a detailed information pertaining to the setting with which the recommendation
    is concerned.
element43:
  name: Rationale Statement
  requirements:
  - Rationale statement should include the importance of the recommendation.
element44:
  name: CIS Critical Security Controls®
  requirements:
  - The mapping between a recommendation and the CIS Controls is organized by CIS
    Controls version, Safeguard, and Implementation Group (IG). The Benchmark in its
    entirety addresses the CIS Controls safeguards of (v7) "5.1 - Establish Secure
    Configurations" and (v8) '4.1 - Establish and Maintain a Secure Configuration
    Process" so individual recommendations will not be mapped to these safeguards.
element45:
  name: Level 1 - Docker - Linux
  requirements:
  - 'Items in this profile intend to: o Be practical and prudent; o Provide a clear
    security benefit; and o Not inhibit the utility of the technology beyond acceptable
    means.'
  - Be practical and prudent
  - Provide a clear security benefit
  - Not inhibit the utility of the technology beyond acceptable means
element46:
  name: Level 2 - Docker - Linux
  requirements:
  - 'Items in this profile exhibit one or more of the following characteristics: o
    Are intended for environments or use cases where security is paramount; o Acts
    as defense in depth measure; o May negatively inhibit the utility or performance
    of the technology.'
  - Are intended for environments or use cases where security is paramount
  - Acts as defense in depth measure
  - May negatively inhibit the utility or performance of the technology
