  requirements:
  - Ensure insecure registries are not used (Manual)
  - Use TLS for secure registries.
  - 2.5 Ensure insecure registries are not used (Manual)
  - Docker considers a private registry either secure or insecure. By default, registries
    are considered secure.
element97:
  name: Control Use of Administrative Privileges
  requirements:
  - Controlled Use of Administrative Privileges
element98:
  name: Storage Driver
  requirements:
  - Do not use aufs as the storage driver for your Docker instance.
  - Use overlay2 as the storage driver on most of the platforms.
element99:
